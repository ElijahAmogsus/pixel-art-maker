<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Pixel Art Maker | ElijahAmogsus</title>
  <style>
    :root {
      --base: #1e1e2e; --mantle: #181825; --surface0: #313244;
      --surface1: #45475a; --text: #cdd6f4; --subtext0: #a6adc8;
      --accent: #89b4fa;
    }

    * { box-sizing: border-box; transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease; }

    html, body {
      margin: 0; padding: 0; min-height: 100vh; width: 100%;
      background-color: var(--base); color: var(--text); font-family: monospace;
    }

    body { display: flex; flex-direction: column; align-items: center; padding: 24px 14px; }

    .back-link { color: var(--accent); text-decoration: none; font-weight: bold; margin-top: 24px; display: inline-block; }
    .back-link:hover { text-decoration: underline; }

    .theme-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; align-items: center; }

    .theme-btn, .accent-select, .ctrl-btn, .ctrl-select, .num-input {
      background-color: var(--mantle); color: var(--text); border: 2px solid var(--surface1);
      border-radius: 6px; padding: 6px 10px; font-family: monospace; font-weight: bold; cursor: pointer;
    }

    .num-input { width: 64px; text-align: center; cursor: text; background-color: var(--base); }

    .theme-btn:hover, .theme-btn.active, .accent-select:hover, .accent-select:focus,
    .ctrl-btn:hover, .ctrl-btn.active, .ctrl-select:hover, .ctrl-select:focus, .num-input:focus {
      border-color: var(--accent); background-color: var(--surface0); outline: none;
    }

    h1 { color: var(--accent); margin: 0 0 6px 0; font-size: clamp(1.5rem, 6vw, 2rem); text-align: center; }
    p { color: var(--subtext0); margin: 0 0 20px 0; text-align: center; }

    .workspace {
      width: 100%; max-width: 920px; display: grid;
      grid-template-columns: 1fr 305px; gap: 16px; align-items: start;
    }

    .card {
      background-color: var(--mantle); border: 2px solid var(--surface1);
      border-radius: 10px; padding: 16px;
    }

    .card h3 { color: var(--accent); margin: 0 0 10px 0; font-size: 0.98rem; }

    .canvas-stage {
      width: 100%; max-width: 540px; min-height: 300px; margin: 0 auto;
      display: flex; justify-content: center; align-items: center;
    }

    .canvas-wrap {
      border: 2px solid var(--surface1); border-radius: 8px; overflow: hidden;
      background-image:
        linear-gradient(45deg, #2a2b3d 25%, transparent 25%),
        linear-gradient(-45deg, #2a2b3d 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2a2b3d 75%),
        linear-gradient(-45deg, transparent 75%, #2a2b3d 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-color: #1f202e;
    }

    canvas#pixelCanvas {
      width: 100%; height: 100%; display: block;
      touch-action: none; cursor: crosshair; image-rendering: pixelated;
    }

    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
    .btn-grid.four { grid-template-columns: repeat(4, 1fr); }
    .custom-res-row { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
    .color-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

    input[type="color"] {
      width: 46px; height: 36px; border: 2px solid var(--surface1);
      border-radius: 6px; background: var(--base); cursor: pointer; padding: 2px;
    }

    .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
    .swatch {
      width: 100%; aspect-ratio: 1 / 1; border-radius: 5px;
      border: 2px solid var(--surface1); cursor: pointer; padding: 0;
    }
    .swatch.active { border-color: #ffffff; transform: scale(1.1); }

    .toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px; background: var(--base); border: 2px solid var(--surface1);
      border-radius: 6px; margin-bottom: 14px; font-size: 0.9rem; font-weight: bold;
    }
    .toggle-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

    .export-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .primary-btn {
      flex: 1; min-width: 120px; background-color: var(--accent); color: var(--base);
      border: 2px solid var(--accent); border-radius: 6px; padding: 8px 10px;
      font-family: monospace; font-weight: bold; cursor: pointer;
    }
    .primary-btn:hover { opacity: 0.92; }

    @media (max-width: 760px) { .workspace { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="theme-bar">
    <button class="theme-btn active" onclick="setTheme('mocha')">🌿 Mocha</button>
    <button class="theme-btn" onclick="setTheme('macchiato')">🌺 Macchiato</button>
    <button class="theme-btn" onclick="setTheme('frappe')">🪴 Frappé</button>
    <button class="theme-btn" onclick="setTheme('latte')">🌻 Latte</button>
    <select id="accentSelect" class="accent-select" onchange="setAccent(this.value)" aria-label="Accent Color">
      <option value="rosewater">🌸 Rosewater</option>
      <option value="flamingo">🦩 Flamingo</option>
      <option value="pink">💖 Pink</option>
      <option value="mauve">🔮 Mauve</option>
      <option value="red">🍎 Red</option>
      <option value="maroon">🍒 Maroon</option>
      <option value="peach">🍑 Peach</option>
      <option value="yellow">🍋 Yellow</option>
      <option value="green">🍏 Green</option>
      <option value="teal">🌊 Teal</option>
      <option value="sky">☁️ Sky</option>
      <option value="sapphire">💎 Sapphire</option>
      <option value="blue" selected>💙 Blue</option>
      <option value="lavender">🪻 Lavender</option>
    </select>
  </div>

  <h1>🎨 Pixel Art Maker</h1>
  <p>Draw crisp sprites, import any image & export in multiple formats</p>

  <div class="workspace">
    <div class="card">
      <div class="canvas-stage" id="canvasStage">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="pixelCanvas" width="512" height="512"></canvas>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Resolution (<span id="resBadge">16×16</span>)</h3>
      <div class="btn-grid four" id="sizeBtns">
        <button class="ctrl-btn" data-size="8">8×8</button>
        <button class="ctrl-btn active" data-size="16">16×16</button>
        <button class="ctrl-btn" data-size="32">32×32</button>
        <button class="ctrl-btn" data-size="64">64×64</button>
      </div>
      <div class="custom-res-row">
        <input type="number" id="customW" class="num-input" min="2" max="128" value="16" aria-label="Grid Width">
        <span>×</span>
        <input type="number" id="customH" class="num-input" min="2" max="128" value="16" aria-label="Grid Height">
        <button class="ctrl-btn" style="flex:1;" onclick="applyCustomRes()">Set Size</button>
      </div>

      <h3>Tools</h3>
      <div class="btn-grid" id="toolBtns">
        <button class="ctrl-btn active" data-tool="pencil">✏️ Pencil</button>
        <button class="ctrl-btn" data-tool="eraser">🧽 Eraser</button>
        <button class="ctrl-btn" data-tool="bucket">🪣 Bucket</button>
        <button class="ctrl-btn" data-tool="eyedropper">💉 Picker</button>
      </div>
      <div class="btn-grid">
        <button class="ctrl-btn" id="mirrorBtn" onclick="toggleMirror()">🪞 Mirror: OFF</button>
        <button class="ctrl-btn active" id="gridBtn" onclick="toggleGrid()"># Grid: ON</button>
      </div>

      <h3>Color & Catppuccin Swatches</h3>
      <div class="color-row">
        <input type="color" id="colorPicker" value="#89b4fa" aria-label="Custom Color">
        <span id="hexLabel" style="font-weight: bold;">#89b4fa</span>
      </div>
      <div class="swatches" id="swatchGrid"></div>

      <h3>History & Storage</h3>
      <div class="btn-grid">
        <button class="ctrl-btn" onclick="undo()">↩️ Undo</button>
        <button class="ctrl-btn" onclick="redo()">↪️ Redo</button>
        <button class="ctrl-btn" onclick="clearCanvas()">🗑️ Clear</button>
        <button class="ctrl-btn" onclick="document.getElementById('importInput').click()">📂 Import</button>
      </div>
      <input type="file" id="importInput" accept="image/*,.png,.jpg,.jpeg,.webp,.gif,.svg,.bmp,.ico,.avif,.tif,.tiff" hidden>

      <label class="toggle-row" for="autoSaveToggle">
        <span>💾 Auto-Save Draft</span>
        <input type="checkbox" id="autoSaveToggle" checked>
      </label>

      <h3>Export Sprite</h3>
      <div class="export-row">
        <select id="exportFormat" class="ctrl-select" aria-label="Export Format">
          <option value="png" selected>PNG</option>
          <option value="webp">WEBP</option>
          <option value="jpg">JPG</option>
          <option value="bmp">BMP</option>
          <option value="ico">ICO</option>
          <option value="svg">SVG</option>
        </select>
        <select id="exportScale" class="ctrl-select" aria-label="Export Scale">
          <option value="1">1×</option>
          <option value="10" selected>10×</option>
          <option value="20">20×</option>
          <option value="32">32×</option>
        </select>
        <button class="primary-btn" onclick="exportArt()">⬇️ Export</button>
      </div>
    </div>
  </div>

  <a href="/" class="back-link">← Back to Dev Hub</a>
    <script>
    const themes = {
      mocha: {
        base: '#1e1e2e', mantle: '#181825', surface0: '#313244', surface1: '#45475a', text: '#cdd6f4', subtext0: '#a6adc8',
        accents: { rosewater: '#f5e0dc', flamingo: '#f2cdcd', pink: '#f5c2e7', mauve: '#cba6f7', red: '#f38ba8', maroon: '#eba0ac', peach: '#fab387', yellow: '#f9e2af', green: '#a6e3a1', teal: '#94e2d5', sky: '#89dceb', sapphire: '#74c7ec', blue: '#89b4fa', lavender: '#b4befe' }
      },
      macchiato: {
        base: '#24273a', mantle: '#1e2030', surface0: '#363a4f', surface1: '#494d64', text: '#cad3f5', subtext0: '#a5adcb',
        accents: { rosewater: '#f4dbd6', flamingo: '#f0c6c6', pink: '#f5bde6', mauve: '#c6a0f6', red: '#ed8796', maroon: '#ee99a0', peach: '#f5a97f', yellow: '#eed49f', green: '#a6da95', teal: '#8bd5ca', sky: '#91d7e3', sapphire: '#7dc4e4', blue: '#8aadf4', lavender: '#b7bdf8' }
      },
      frappe: {
        base: '#303446', mantle: '#292c3c', surface0: '#414559', surface1: '#51576d', text: '#c6d0f5', subtext0: '#a5adce',
        accents: { rosewater: '#f2d5cf', flamingo: '#eebebe', pink: '#f4b8e4', mauve: '#ca9ee6', red: '#e78284', maroon: '#ea999c', peach: '#ef9f76', yellow: '#e5c890', green: '#a6d189', teal: '#81c8be', sky: '#99d1db', sapphire: '#85c1dc', blue: '#8caaee', lavender: '#babbf1' }
      },
      latte: {
        base: '#eff1f5', mantle: '#e6e9ef', surface0: '#ccd0da', surface1: '#bcc0cc', text: '#4c4f69', subtext0: '#6c6f85',
        accents: { rosewater: '#dc8a78', flamingo: '#dd7878', pink: '#ea76cb', mauve: '#8839ef', red: '#d20f39', maroon: '#e64553', peach: '#fe640b', yellow: '#df8e1d', green: '#40a02b', teal: '#179299', sky: '#04a5e5', sapphire: '#209fb5', blue: '#1e66f5', lavender: '#7287fd' }
      }
    };

    let currentTheme = localStorage.getItem('catppuccin-theme') || 'mocha';
    let currentAccent = localStorage.getItem('catppuccin-accent') || 'blue';

    function applyPalette() {
      const p = themes[currentTheme] || themes.mocha;
      const root = document.documentElement.style;
      for (const [k, v] of Object.entries(p)) {
        if (k !== 'accents') root.setProperty('--' + k, v);
      }
      root.setProperty('--accent', p.accents[currentAccent] || p.accents.blue);
      document.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('onclick').includes("'" + currentTheme + "'"));
      });
      document.getElementById('accentSelect').value = currentAccent;
      renderSwatches();
    }

    function setTheme(name) { currentTheme = name; localStorage.setItem('catppuccin-theme', name); applyPalette(); }
    function setAccent(accent) { currentAccent = accent; localStorage.setItem('catppuccin-accent', accent); applyPalette(); }

    const DRAFT_KEY = 'devhub-pixel-art-draft';
    const AUTOSAVE_PREF_KEY = 'devhub-pixel-art-autosave';

    const canvas = document.getElementById('pixelCanvas');
    const canvasWrap = document.getElementById('canvasWrap');
    const canvasStage = document.getElementById('canvasStage');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const hexLabel = document.getElementById('hexLabel');
    const autoSaveToggle = document.getElementById('autoSaveToggle');
    const customWInput = document.getElementById('customW');
    const customHInput = document.getElementById('customH');
    const resBadge = document.getElementById('resBadge');

    let gridW = 16;
    let gridH = 16;
    let pixels = Array(gridW * gridH).fill(null);
    let activeTool = 'pencil';
    let activeColor = '#89b4fa';
    let mirrorMode = false;
    let showGrid = true;
    let isDrawing = false;
    let strokeChanged = false;
    let undoStack = [];
    let redoStack = [];
          function syncResolutionUI() {
      resBadge.textContent = gridW + '×' + gridH;
      customWInput.value = gridW;
      customHInput.value = gridH;
      document.querySelectorAll('#sizeBtns .ctrl-btn').forEach(b => {
        const s = parseInt(b.dataset.size, 10);
        b.classList.toggle('active', gridW === s && gridH === s);
      });

      const maxSide = Math.min(canvasStage.clientWidth || 500, 520);
      const scale = Math.max(1, Math.floor(maxSide / Math.max(gridW, gridH)));
      const dispW = gridW * scale;
      const dispH = gridH * scale;
      canvasWrap.style.width = dispW + 'px';
      canvasWrap.style.height = dispH + 'px';
      canvas.width = dispW;
      canvas.height = dispH;
    }

    function renderSwatches() {
      const grid = document.getElementById('swatchGrid');
      const p = themes[currentTheme] || themes.mocha;
      grid.innerHTML = '';
      Object.values(p.accents).forEach(hex => {
        const btn = document.createElement('button');
        btn.className = 'swatch' + (hex.toLowerCase() === activeColor.toLowerCase() ? ' active' : '');
        btn.style.backgroundColor = hex;
        btn.title = hex;
        btn.onclick = () => setActiveColor(hex);
        grid.appendChild(btn);
      });
    }

    function setActiveColor(hex) {
      activeColor = hex;
      colorPicker.value = hex;
      hexLabel.textContent = hex.toLowerCase();
      renderSwatches();
      saveDraft();
    }

    function saveDraft() {
      if (!autoSaveToggle.checked) return;
      localStorage.setItem(DRAFT_KEY, JSON.stringify({ gridW, gridH, pixels, activeColor }));
    }

    function loadDraft() {
      const pref = localStorage.getItem(AUTOSAVE_PREF_KEY);
      autoSaveToggle.checked = pref === null ? true : pref === 'true';
      if (!autoSaveToggle.checked) return;
      const raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        if (data && Array.isArray(data.pixels)) {
          gridW = data.gridW || data.gridSize || 16;
          gridH = data.gridH || data.gridSize || 16;
          if (data.pixels.length === gridW * gridH) pixels = data.pixels;
          if (data.activeColor) setActiveColor(data.activeColor);
        }
      } catch (e) {}
    }

    autoSaveToggle.addEventListener('change', () => {
      localStorage.setItem(AUTOSAVE_PREF_KEY, String(autoSaveToggle.checked));
      if (autoSaveToggle.checked) saveDraft();
      else localStorage.removeItem(DRAFT_KEY);
    });

    function pushHistory() {
      undoStack.push(pixels.slice());
      if (undoStack.length > 40) undoStack.shift();
      redoStack = [];
    }

    function undo() {
      if (!undoStack.length) return;
      redoStack.push(pixels.slice());
      pixels = undoStack.pop();
      drawBoard();
      saveDraft();
    }

    function redo() {
      if (!redoStack.length) return;
      undoStack.push(pixels.slice());
      pixels = redoStack.pop();
      drawBoard();
      saveDraft();
    }

    function drawBoard() {
      const cellW = canvas.width / gridW;
      const cellH = canvas.height / gridH;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < gridH; y++) {
        for (let x = 0; x < gridW; x++) {
          const color = pixels.at(y * gridW + x);
          if (color) {
            ctx.fillStyle = color;
            ctx.fillRect(Math.floor(x * cellW), Math.floor(y * cellH), Math.ceil(cellW), Math.ceil(cellH));
          }
        }
      }

      if (showGrid) {
        ctx.strokeStyle = 'rgba(205, 214, 244, 0.16)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 1; x < gridW; x++) {
          const px = Math.round(x * cellW) + 0.5;
          ctx.moveTo(px, 0);
          ctx.lineTo(px, canvas.height);
        }
        for (let y = 1; y < gridH; y++) {
          const py = Math.round(y * cellH) + 0.5;
          ctx.moveTo(0, py);
          ctx.lineTo(canvas.width, py);
        }
        ctx.stroke();
      }
    }

    function floodFill(startX, startY, targetColor, replacementColor) {
      if (targetColor === replacementColor) return;
      const stack = [{ x: startX, y: startY }];
      while (stack.length) {
        const pt = stack.pop();
        if (pt.x < 0 || pt.x >= gridW || pt.y < 0 || pt.y >= gridH) continue;
        const idx = pt.y * gridW + pt.x;
        if (pixels.at(idx) !== targetColor) continue;
        pixels.splice(idx, 1, replacementColor);
        strokeChanged = true;
        stack.push({ x: pt.x + 1, y: pt.y }, { x: pt.x - 1, y: pt.y }, { x: pt.x, y: pt.y + 1 }, { x: pt.x, y: pt.y - 1 });
      }
    }

    function applyToolAt(x, y) {
      if (x < 0 || x >= gridW || y < 0 || y >= gridH) return;
      const idx = y * gridW + x;

      if (activeTool === 'eyedropper') {
        const picked = pixels.at(idx);
        if (picked) setActiveColor(picked);
        setTool('pencil');
        return;
      }

      if (activeTool === 'bucket') {
        floodFill(x, y, pixels.at(idx), activeColor);
        if (mirrorMode) {
          const mx = gridW - 1 - x;
          floodFill(mx, y, pixels.at(y * gridW + mx), activeColor);
        }
        drawBoard();
        return;
      }

      const val = activeTool === 'eraser' ? null : activeColor;
      if (pixels.at(idx) !== val) {
        pixels.splice(idx, 1, val);
        strokeChanged = true;
      }
      if (mirrorMode) {
        const mx = gridW - 1 - x;
        const mIdx = y * gridW + mx;
        if (pixels.at(mIdx) !== val) {
          pixels.splice(mIdx, 1, val);
          strokeChanged = true;
        }
      }
      drawBoard();
    }
          function getCellFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(((e.clientX - rect.left) / rect.width) * gridW);
      const y = Math.floor(((e.clientY - rect.top) / rect.height) * gridH);
      return { x, y };
    }

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      isDrawing = true;
      strokeChanged = false;
      if (activeTool !== 'eyedropper') pushHistory();
      const cell = getCellFromEvent(e);
      applyToolAt(cell.x, cell.y);
    });

    canvas.addEventListener('pointermove', e => {
      if (!isDrawing) return;
      if (activeTool === 'pencil' || activeTool === 'eraser') {
        const cell = getCellFromEvent(e);
        applyToolAt(cell.x, cell.y);
      }
    });

    function endStroke() {
      if (!isDrawing) return;
      isDrawing = false;
      if (strokeChanged) saveDraft();
      else if (activeTool !== 'eyedropper') undoStack.pop();
    }

    canvas.addEventListener('pointerup', endStroke);
    canvas.addEventListener('pointercancel', endStroke);

    function setTool(tool) {
      activeTool = tool;
      document.querySelectorAll('#toolBtns .ctrl-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tool === tool);
      });
    }

    document.querySelectorAll('#toolBtns .ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => setTool(btn.dataset.tool));
    });

    function changeResolution(newW, newH) {
      if (newW === gridW && newH === gridH) return;
      const hasArt = pixels.some(p => p !== null);
      if (hasArt && !confirm('Switching to ' + newW + '×' + newH + ' will clear your current drawing. Continue?')) {
        customWInput.value = gridW;
        customHInput.value = gridH;
        return;
      }
      gridW = newW;
      gridH = newH;
      pixels = Array(gridW * gridH).fill(null);
      undoStack = [];
      redoStack = [];
      syncResolutionUI();
      drawBoard();
      saveDraft();
    }

    document.querySelectorAll('#sizeBtns .ctrl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const s = parseInt(btn.dataset.size, 10);
        changeResolution(s, s);
      });
    });

    function applyCustomRes() {
      const w = Math.min(128, Math.max(2, parseInt(customWInput.value, 10) || 16));
      const h = Math.min(128, Math.max(2, parseInt(customHInput.value, 10) || 16));
      changeResolution(w, h);
    }

    function toggleMirror() {
      mirrorMode = !mirrorMode;
      const btn = document.getElementById('mirrorBtn');
      btn.textContent = mirrorMode ? '🪞 Mirror: ON' : '🪞 Mirror: OFF';
      btn.classList.toggle('active', mirrorMode);
    }

    function toggleGrid() {
      showGrid = !showGrid;
      const btn = document.getElementById('gridBtn');
      btn.textContent = showGrid ? '# Grid: ON' : '# Grid: OFF';
      btn.classList.toggle('active', showGrid);
      drawBoard();
    }

    function clearCanvas() {
      if (!pixels.some(p => p !== null)) return;
      pushHistory();
      pixels = Array(gridW * gridH).fill(null);
      drawBoard();
      saveDraft();
    }

    colorPicker.addEventListener('input', e => setActiveColor(e.target.value));

    document.getElementById('importInput').addEventListener('change', e => {
      const file = e.target.files ? e.target.files.item(0) : null;
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          pushHistory();
          const off = document.createElement('canvas');
          off.width = gridW;
          off.height = gridH;
          const octx = off.getContext('2d');
          octx.imageSmoothingEnabled = false;
          octx.drawImage(img, 0, 0, gridW, gridH);
          const data = octx.getImageData(0, 0, gridW, gridH).data;

          for (let i = 0; i < gridW * gridH; i++) {
            const r = data.at(i * 4);
            const g = data.at(i * 4 + 1);
            const b = data.at(i * 4 + 2);
            const a = data.at(i * 4 + 3);
            if (a < 128) {
              pixels.splice(i, 1, null);
            } else {
              const hex = '#' + Array.of(r, g, b).map(v => v.toString(16).padStart(2, '0')).join('');
              pixels.splice(i, 1, hex);
            }
          }
          drawBoard();
          saveDraft();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    function encodeBMP(cnv) {
      const c = cnv.getContext('2d');
      const w = cnv.width;
      const h = cnv.height;
      const imgData = c.getImageData(0, 0, w, h).data;
      const rowSize = Math.floor((24 * w + 31) / 32) * 4;
      const pixelArraySize = rowSize * h;
      const fileSize = 54 + pixelArraySize;
      const buffer = new ArrayBuffer(fileSize);
      const view = new DataView(buffer);

      view.setUint16(0, 0x424d, false);
      view.setUint32(2, fileSize, true);
      view.setUint32(10, 54, true);
      view.setUint32(14, 40, true);
      view.setInt32(18, w, true);
      view.setInt32(22, h, true);
      view.setUint16(26, 1, true);
      view.setUint16(28, 24, true);
      view.setUint32(34, pixelArraySize, true);

      let offset = 54;
      for (let y = h - 1; y >= 0; y--) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          view.setUint8(offset++, imgData.at(i + 2));
          view.setUint8(offset++, imgData.at(i + 1));
          view.setUint8(offset++, imgData.at(i));
        }
        while ((offset - 54) % rowSize !== 0) view.setUint8(offset++, 0);
      }
      return new Blob(Array.of(buffer), { type: 'image/bmp' });
    }

    async function encodeICO(srcCanvas) {
      const size = 64;
      const icoCanvas = document.createElement('canvas');
      icoCanvas.width = size;
      icoCanvas.height = size;
      const ictx = icoCanvas.getContext('2d');
      ictx.imageSmoothingEnabled = false;
      ictx.drawImage(srcCanvas, 0, 0, size, size);

      const pngBlob = await new Promise(res => icoCanvas.toBlob(res, 'image/png'));
      const pngBytes = new Uint8Array(await pngBlob.arrayBuffer());
      const icoBuffer = new ArrayBuffer(22 + pngBytes.length);
      const view = new DataView(icoBuffer);

      view.setUint16(0, 0, true);
      view.setUint16(2, 1, true);
      view.setUint16(4, 1, true);
      view.setUint8(6, size);
      view.setUint8(7, size);
      view.setUint16(10, 1, true);
      view.setUint16(12, 32, true);
      view.setUint32(14, pngBytes.length, true);
      view.setUint32(18, 22, true);

      new Uint8Array(icoBuffer, 22).set(pngBytes);
      return new Blob(Array.of(icoBuffer), { type: 'image/x-icon' });
    }

    async function exportArt() {
      const fmt = document.getElementById('exportFormat').value;
      const scale = parseInt(document.getElementById('exportScale').value, 10) || 10;
      const filename = 'pixel-art-' + gridW + 'x' + gridH + '-' + scale + 'x.' + fmt;

      if (fmt === 'svg') {
        const w = gridW * scale;
        const h = gridH * scale;
        let rects = '';
        for (let y = 0; y < gridH; y++) {
          for (let x = 0; x < gridW; x++) {
            const color = pixels.at(y * gridW + x);
            if (color) {
              rects += '<rect x="' + (x * scale) + '" y="' + (y * scale) + '" width="' + scale + '" height="' + scale + '" fill="' + color + '"/>';
            }
          }
        }
        const svg = '<svg xmlns="http://w3.org" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges">' + rects + '</svg>';
        triggerDownload(new Blob(Array.of(svg), { type: 'image/svg+xml' }), filename);
        return;
      }

      const src = document.createElement('canvas');
      src.width = gridW;
      src.height = gridH;
      const sctx = src.getContext('2d');
      for (let y = 0; y < gridH; y++) {
        for (let x = 0; x < gridW; x++) {
          const color = pixels.at(y * gridW + x);
          if (color) {
            sctx.fillStyle = color;
            sctx.fillRect(x, y, 1, 1);
          }
        }
      }

      const out = document.createElement('canvas');
      out.width = gridW * scale;
      out.height = gridH * scale;
      const octx = out.getContext('2d');
      if (fmt === 'jpg' || fmt === 'bmp') {
        octx.fillStyle = '#1e1e2e';
        octx.fillRect(0, 0, out.width, out.height);
      }
      octx.imageSmoothingEnabled = false;
      octx.drawImage(src, 0, 0, out.width, out.height);

      let blob;
      if (fmt === 'bmp') blob = encodeBMP(out);
      else if (fmt === 'ico') blob = await encodeICO(src);
      else if (fmt === 'jpg') blob = await new Promise(res => out.toBlob(res, 'image/jpeg', 0.95));
      else if (fmt === 'webp') blob = await new Promise(res => out.toBlob(res, 'image/webp', 0.95));
      else blob = await new Promise(res => out.toBlob(res, 'image/png'));

      triggerDownload(blob, filename);
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = filename;
      link.href = url;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    window.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        if (e.shiftKey) redo();
        else undo();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
        e.preventDefault();
        redo();
      }
    });

    window.addEventListener('resize', () => { syncResolutionUI(); drawBoard(); });

    applyPalette();
    loadDraft();
    syncResolutionUI();
    drawBoard();
  </script>
</body>
</html>
